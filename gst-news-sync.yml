name: GST News Daily Sync

on:
  schedule:
    # 03:30 UTC = 09:00 IST. GitHub may delay scheduled jobs during busy periods.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-news-daily-sync
  cancel-in-progress: false

jobs:
  sync-official-gst-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-gst-news.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-gst-news.txt

      - name: Sync official GST news to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: python scripts/sync_gst_news.py
